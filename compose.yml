# Cuidarte+ · Ambiente QA
# Los repos deben estar como carpetas hermanas:
#   Cuidarte-SC/
#   ├── infra-cuidarte/     <- este repo (ejecutar docker compose aquí)
#   ├── api-cuidarte/
#   ├── frontend-cuidarte/
#   └── qa-cuidarte/
#
# Solo base de datos:      docker compose up -d
# Sistema completo:        docker compose --profile app up -d --build

name: cuidarte

services:
  db:
    image: postgres:14-alpine
    container_name: cuidarte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Santiago
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde tu máquina (inspección QA)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: ../api-cuidarte
    container_name: cuidarte-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}   # NFR-SEG-3: cifrado en reposo
      DOCUMENTOS_DIR: /data/documentos
      TZ: America/Santiago
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - documentos:/data/documentos

  frontend:
    profiles: ["app"]
    build: ../frontend-cuidarte
    container_name: cuidarte-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"

volumes:
  pgdata:
  documentos: